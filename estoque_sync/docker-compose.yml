services:
  postgres:
    image: postgres:17-alpine
    container_name: estoque-sync-postgres
    environment:
      POSTGRES_DB: carla_db
      POSTGRES_USER: carla
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-senha_segura_aqui}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carla -d carla_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  estoque-sync:
    build: .
    container_name: estoque-sync-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: carla_db
      POSTGRES_USER: carla
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-senha_segura_aqui}
      OBJETIVA_URL: ${OBJETIVA_URL:-https://carlabaleeiro.objetivaweb.app.br}
      OBJETIVA_USERNAME: ${OBJETIVA_USERNAME:-}
      OBJETIVA_PASSWORD: ${OBJETIVA_PASSWORD:-}
      CHROME_HEADLESS: ${CHROME_HEADLESS:-false}
      SYNC_INTERVAL_SECONDS: ${SYNC_INTERVAL_SECONDS:-3600}
      SYNC_INTERVAL_JITTER_SECONDS: ${SYNC_INTERVAL_JITTER_SECONDS:-300}
      SYNC_TIMEOUT_SECONDS: ${SYNC_TIMEOUT_SECONDS:-1800}
      SYNC_MAX_ATTEMPTS: ${SYNC_MAX_ATTEMPTS:-2}
      SYNC_RETRY_DELAY_SECONDS: ${SYNC_RETRY_DELAY_SECONDS:-300}
      SYNC_FAILURE_THRESHOLD: ${SYNC_FAILURE_THRESHOLD:-3}
      SYNC_FAILURE_COOLDOWN_SECONDS: ${SYNC_FAILURE_COOLDOWN_SECONDS:-21600}
      SYNC_STARTUP_MIN_INTERVAL_SECONDS: ${SYNC_STARTUP_MIN_INTERVAL_SECONDS:-1800}
      SYNC_MIN_PRODUCTS: ${SYNC_MIN_PRODUCTS:-6000}
      SYNC_MAX_PRODUCT_DROP_PERCENT: ${SYNC_MAX_PRODUCT_DROP_PERCENT:-10}
      PRICE_UPDATE_INTERVAL_HOURS: ${PRICE_UPDATE_INTERVAL_HOURS:-24}
      PRICE_MAX_CHANGE_PERCENT: ${PRICE_MAX_CHANGE_PERCENT:-30}
      TURNSTILE_MAX_CLICKS: ${TURNSTILE_MAX_CLICKS:-3}
      TURNSTILE_TOKEN_WAIT_SECONDS: ${TURNSTILE_TOKEN_WAIT_SECONDS:-15}
      TURNSTILE_POLL_INTERVAL_SECONDS: ${TURNSTILE_POLL_INTERVAL_SECONDS:-1}
      LOGIN_REDIRECT_TIMEOUT_SECONDS: ${LOGIN_REDIRECT_TIMEOUT_SECONDS:-30}
      LOGIN_DIAGNOSTICS_DIR: /app/logs
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-console}
      THIRD_PARTY_LOG_LEVEL: ${THIRD_PARTY_LOG_LEVEL:-WARNING}
      DOWNLOAD_DIR: /app/downloads
      BROWSER_EXECUTABLE_PATH: ${BROWSER_EXECUTABLE_PATH:-}
    volumes:
      - ./data/chrome-profile:/app/data/chrome-profile
      - ./downloads:/app/downloads
      - ./logs:/app/logs
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp=unconfined
    restart: unless-stopped

volumes:
  postgres_data:
